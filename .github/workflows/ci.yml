name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**", "chore/**", "refactor/**"]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend — Lint & Import Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: |
          cd backend
          ruff check .

      - name: Verify imports resolve
        run: |
          cd backend
          python -c "from app.core.config import settings"
          python -c "from app.core.exceptions import AppException"
          python -c "from app.main import app"

  frontend:
    name: Frontend — Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Type check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build
        run: |
          cd frontend
          npm run build
