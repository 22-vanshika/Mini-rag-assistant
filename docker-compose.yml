version: "3.9"

services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - 'CORS_ORIGINS=["http://localhost:5173"]'
      - APP_ENV=development
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - ollama

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  ollama_data:
  hf_cache:
